AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CHP incident poller + daily PeMS traffic workflow

Parameters:
  PandasLayerArn:
    Type: String
    Description: AWS SDK for pandas layer (pandas, pyarrow, awswrangler) matching the runtime
    Default: arn:aws:lambda:us-west-2:336392948345:layer:AWSSDKPandas-Python314:11
  GlueDatabaseName:
    Type: String
    Default: traffic_bronze
  DispatchIds:
    Type: String
    Description: CHP dispatch centers to collect (comma-separated). Add centers here to expand coverage.
    Default: LACC,VTCC,OCCC,INCC,BCCC,BSCC,ICCC,ECCC
  AlertEmail:
    Type: String
    Description: Email for failure alerts (confirm the subscription email AWS sends). Blank = no alerts.
    Default: ""

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    CodeUri: src/
    Runtime: python3.14
    Layers:
      - !Ref PandasLayerArn
    Environment:
      Variables:
        BUCKET: !Ref Lake
        GLUE_DB: !Ref GlueDatabaseName
        STATE_TABLE: !Ref ChpState
        PAIRING_TABLE: !Ref PemsPairing
        ATHENA_WORKGROUP: !Ref AthenaWorkGroup
        DISPATCH_IDS: !Ref DispatchIds

Resources:
  # ---------- storage ----------
  Lake:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain          # keep collected data even if the stack is deleted
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BronzeDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: Parsed raw data (one table per source file type)

  ChpState:
    Type: AWS::Serverless::SimpleTable   # on-demand DynamoDB; holds the open-incident state
    Properties:
      PrimaryKey:
        Name: pk
        Type: String

  PemsPairing:
    Type: AWS::Serverless::SimpleTable   # on-demand DynamoDB; pairing status per district-day
    Properties:
      PrimaryKey:
        Name: pk
        Type: String

  GlueAccessPolicy:
    Type: AWS::IAM::ManagedPolicy        # read/write tables in the bronze Glue database only
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - glue:GetDatabase
              - glue:GetTable
              - glue:GetTables
              - glue:CreateTable
              - glue:UpdateTable
              - glue:GetPartition
              - glue:GetPartitions
              - glue:CreatePartition
              - glue:BatchCreatePartition
              - glue:BatchGetPartition
              - glue:BatchDeletePartition
            Resource:
              - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
              - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}
              - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/*

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: traffic
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 10737418240   # 10 GB cap per query (~5 cents)
        ResultConfiguration:
          OutputLocation: !Sub s3://${Lake}/athena-results/

  # ---------- CHP poller (every minute) ----------
  ChpPoller:
    Type: AWS::Serverless::Function
    Properties:
      Handler: chp.handler.main
      MemorySize: 1024
      Timeout: 120                  # downloader retries + parsing + Parquet writes
      EventInvokeConfig:            # a failed poll is not retried; the next minute's poll replaces it
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 60
      Policies:
        - S3CrudPolicy: { BucketName: !Ref Lake }
        - DynamoDBCrudPolicy: { TableName: !Ref ChpState }
        - !Ref GlueAccessPolicy
      Events:
        EveryMinute:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 60

  # ---------- daily PeMS workflow ----------
  PemsPlanner:
    Type: AWS::Serverless::Function
    Properties:
      Handler: pems.orchestrate.plan
      MemorySize: 512
      Timeout: 300
      Policies:
        - S3CrudPolicy: { BucketName: !Ref Lake }
        - DynamoDBCrudPolicy: { TableName: !Ref PemsPairing }
        - AthenaQueryPolicy: { WorkGroupName: !Ref AthenaWorkGroup }
        - !Ref GlueAccessPolicy

  PemsFetcher:
    Type: AWS::Serverless::Function
    Properties:
      Handler: pems.handler.main
      MemorySize: 2048
      Timeout: 900                  # one district-day: ~15 MB download + parse + write
      EphemeralStorage:
        Size: 2048
      Policies:
        - S3CrudPolicy: { BucketName: !Ref Lake }
        - DynamoDBCrudPolicy: { TableName: !Ref PemsPairing }
        - SSMParameterReadPolicy: { ParameterName: traffic/pems/* }
        - !Ref GlueAccessPolicy

  PemsReporter:
    Type: AWS::Serverless::Function
    Properties:
      Handler: pems.orchestrate.report
      MemorySize: 512
      Timeout: 120
      Policies:
        - S3CrudPolicy: { BucketName: !Ref Lake }
        - DynamoDBCrudPolicy: { TableName: !Ref PemsPairing }
        - !Ref GlueAccessPolicy

  DailyTrafficWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref PemsPlanner }
        - LambdaInvokePolicy: { FunctionName: !Ref PemsFetcher }
        - LambdaInvokePolicy: { FunctionName: !Ref PemsReporter }
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow           # run the processing job and wait for it
              Action: [codebuild:StartBuild, codebuild:StopBuild, codebuild:BatchGetBuilds]
              Resource: !GetAtt ProcessingJob.Arn
            - Effect: Allow           # how Step Functions waits for a CodeBuild job to finish
              Action: [events:PutTargets, events:PutRule, events:DescribeRule]
              Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventForCodeBuildStartBuildRule
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 10 * * ? *)
            ScheduleExpressionTimezone: America/Los_Angeles
      DefinitionSubstitutions:
        PlanFn: !GetAtt PemsPlanner.Arn
        FetchFn: !GetAtt PemsFetcher.Arn
        ReportFn: !GetAtt PemsReporter.Arn
        JobName: !Ref ProcessingJob
      Definition:
        Comment: >
          Pull PeMS traffic data only for district-days that had CHP incidents, then rebuild the
          tables (and on Mondays retrain the models and email a report). The rebuild runs even if
          some downloads failed; the workflow is then marked failed so the alarm emails you.
        StartAt: Plan
        States:
          Plan:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${PlanFn}", Payload.$: "$" }
            OutputPath: $.Payload
            Retry:
              - { ErrorEquals: [States.ALL], IntervalSeconds: 60, MaxAttempts: 2, BackoffRate: 2 }
            Next: FetchEach
          FetchEach:
            Type: Map
            ItemsPath: $.todo
            MaxConcurrency: 1       # one download at a time, to be polite to PeMS
            ItemProcessor:
              ProcessorConfig: { Mode: INLINE }
              StartAt: Fetch
              States:
                Fetch:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters: { FunctionName: "${FetchFn}", Payload.$: "$" }
                  OutputPath: $.Payload
                  Retry:
                    - { ErrorEquals: [States.ALL], IntervalSeconds: 120, MaxAttempts: 3, BackoffRate: 2 }
                  Catch:
                    - { ErrorEquals: [States.ALL], ResultPath: $.error, Next: MarkFailed }
                  End: true
                MarkFailed:
                  Type: Pass
                  Parameters: { district.$: $.district, date.$: $.date, status: failed, error.$: $.error }
                  End: true
            ResultPath: $.results
            Next: Report
          Report:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${ReportFn}", Payload.$: "$" }
            OutputPath: $.Payload
            Catch:
              - { ErrorEquals: [States.ALL], ResultPath: $.fetch_error, Next: ProcessAfterFetchFailure }
            Next: Process
          Process:
            Type: Task
            Resource: arn:aws:states:::codebuild:startBuild.sync
            Parameters: { ProjectName: "${JobName}" }
            ResultSelector: { build_status.$: $.Build.BuildStatus }
            Retry:
              - { ErrorEquals: [States.ALL], IntervalSeconds: 300, MaxAttempts: 1 }
            End: true
          ProcessAfterFetchFailure:
            Type: Task
            Resource: arn:aws:states:::codebuild:startBuild.sync
            Parameters: { ProjectName: "${JobName}" }
            ResultSelector: { build_status.$: $.Build.BuildStatus }
            Catch:
              - { ErrorEquals: [States.ALL], Next: FetchFailed }
            Next: FetchFailed
          FetchFailed:
            Type: Fail
            Error: PemsFetchFailed
            Cause: Some PeMS downloads failed (they are retried tomorrow). The tables were still rebuilt.

  # ---------- scheduled processing: dbt rebuild daily, model report on Mondays ----------
  ProcessingJobLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${AWS::StackName}-processing
      RetentionInDays: 30

  ProcessingJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: processing
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${ProcessingJobLogs.Arn}:*
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${Lake.Arn}/*
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt Lake.Arn
              - Effect: Allow
                Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults,
                         athena:StopQueryExecution, athena:GetWorkGroup, athena:GetDataCatalog,
                         athena:GetDatabase, athena:GetTableMetadata, athena:ListDatabases, athena:ListTableMetadata]
                Resource:
                  - !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}
                  - !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/AwsDataCatalog
              - Effect: Allow           # dbt reads bronze and builds the silver tables
                Action: [glue:GetDatabase, glue:GetDatabases, glue:CreateDatabase, glue:GetTable, glue:GetTables,
                         glue:CreateTable, glue:UpdateTable, glue:DeleteTable, glue:BatchDeleteTable,
                         glue:GetPartition, glue:GetPartitions, glue:BatchGetPartition, glue:CreatePartition,
                         glue:BatchCreatePartition, glue:BatchDeletePartition, glue:DeletePartition]
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/traffic_*
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/traffic_*/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  ProcessingJob:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-processing
      Description: Rebuild the dbt tables daily; on Mondays retrain the models and email a report
      ServiceRole: !GetAtt ProcessingJobRole.Arn
      Source:
        Type: S3
        Location: !Sub ${Lake}/jobs/code.zip     # uploaded by scripts/upload_job_code.py
        BuildSpec: jobs/buildspec.yml
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - { Name: LAKE_BUCKET, Value: !Ref Lake }
          - { Name: ALERT_TOPIC, Value: !Ref AlertTopic }
          - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Ref ProcessingJobLogs }
      TimeoutInMinutes: 60

  # ---------- alerts ----------
  AlertTopic:
    Type: AWS::SNS::Topic

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ChpPollerDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CHP poller failing repeatedly (feed down or code error) - incidents may be missed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ChpPoller }]
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ChpPollerStoppedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CHP poller has stopped running (schedule disabled or broken) - no incidents are being collected
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: !Ref ChpPoller }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 30                 # expect ~60 an hour
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]

  WorkflowFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Daily workflow failed - PeMS data missing for some district-days, or the table rebuild / model report failed
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions: [{ Name: StateMachineArn, Value: !Ref DailyTrafficWorkflow }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  LakeBucket:
    Description: S3 bucket holding the data lake
    Value: !Ref Lake
  WorkflowArn:
    Description: Daily PeMS workflow (Step Functions)
    Value: !Ref DailyTrafficWorkflow
  ProcessingJobName:
    Description: Scheduled processing job (CodeBuild)
    Value: !Ref ProcessingJob
