  - name: training_landmarks_drop_rows_we_cannot_use
    model: fct_training_landmarks
    description: >
      p: our poller first saw it 15 min after CHP logged it -> no 10-min row (its notes weren't visible yet).
      q: backup from 0, lost sight of it at 15 min (censored) -> only the 10-min row; at 20 and 30
         we don't know whether it was still going.
    overrides:
      vars: {landmarks: [10, 20, 30]}
    given:
      - input: ref('fct_incident_backup')
        rows:
          - {log_id: p, has_backup: false, backup_start_min: null, backup_minutes: 0, is_censored: false}
          - {log_id: q, has_backup: true, backup_start_min: 0, backup_minutes: 15, is_censored: true}
      - input: ref('stg_chp_incidents')
        rows:
          - {log_id: p, log_time: "2026-10-01 15:00:00", first_polled_at: "2026-10-01 15:15:00"}
          - {log_id: q, log_time: "2026-10-01 15:00:00", first_polled_at: "2026-10-01 15:00:00"}
      - input: ref('int_note_features')
        rows:
          - {log_id: zzz, first_seen_at: "2026-10-01 15:00:00"}
      - input: ref('stg_chp_units')
        rows:
          - {log_id: zzz, unit_time: "2026-10-01 15:00:00", unit_text: "Unit Assigned"}
      - input: ref('int_incident_precrash')
        rows:
          - {log_id: p}
          - {log_id: q}
      - input: ref('int_incident_traffic')
        rows:
          - {log_id: zzz, role: queue, is_observed: true, miles_upstream: 1.0, minutes_from_log: 0, avg_speed: 60.0, expected_speed: 60.0}
    expect:
      rows:
        - {log_id: p, landmark_min: 20, remaining_minutes: 0, is_censored: false}
        - {log_id: p, landmark_min: 30, remaining_minutes: 0, is_censored: false}
        - {log_id: q, landmark_min: 10, remaining_minutes: 5, is_censored: true}
