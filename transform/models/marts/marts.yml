  - name: training_landmarks_use_only_what_was_known
    model: fct_training_landmarks
    description: >
      Incident a: backed up from 0 to 15 min. A blocking note is seen at +3, lanes reopen at +15,
      a SigAlert note is seen at +25 (CHP's own note time says +2, but we hadn't seen it yet).
      At 10 min: lanes blocked, traffic backed up, 5 min of backup left.
      At 20 min: lanes open, backup over. At 30 min: the SigAlert note now counts.
      Incident c: backup from 10 min, still going when data ended -> censored at every landmark.
    overrides:
      vars: {landmarks: [10, 20, 30]}
    given:
      - input: ref('fct_incident_backup')
        rows:
          - {log_id: a, has_backup: true, backup_start_min: 0, backup_end_min: 15, backup_minutes: 15, is_censored: false}
          - {log_id: c, has_backup: true, backup_start_min: 10, backup_end_min: null, backup_minutes: 30, is_censored: true}
      - input: ref('stg_chp_incidents')
        rows:
          - {log_id: a, log_time: "2026-10-01 15:00:00", first_polled_at: "2026-10-01 15:01:00", initial_type_code: "1182", closed_detected_at: "2026-10-01 15:28:00"}
          - {log_id: c, log_time: "2026-10-01 15:00:00", first_polled_at: "2026-10-01 15:01:00", initial_type_code: "1183", closed_detected_at: null}
      - input: ref('int_note_features')
        rows:
          - {log_id: a, first_seen_at: "2026-10-01 15:03:00", is_blocking: true, lanes_open: false, lanes_blocked: 2, sigalert: false, type_changed_to: null}
          - {log_id: a, first_seen_at: "2026-10-01 15:15:00", is_blocking: false, lanes_open: true, lanes_blocked: null, sigalert: false, type_changed_to: "1181"}
          - {log_id: a, first_seen_at: "2026-10-01 15:25:00", is_blocking: false, lanes_open: false, lanes_blocked: null, sigalert: true, type_changed_to: null}
      - input: ref('stg_chp_units')
        rows:
          - {log_id: a, unit_time: "2026-10-01 15:01:00", unit_text: "Unit Assigned"}
          - {log_id: a, unit_time: "2026-10-01 15:08:00", unit_text: "Unit At Scene"}
      - input: ref('int_incident_precrash')
        rows:
          - {log_id: a, site_speed: 64.0}
          - {log_id: c, site_speed: 50.0}
      - input: ref('int_incident_recurring')
        rows:
          - {log_id: a, typical_ratio_now: 0.5}
      - input: ref('int_backup_slots')
        rows:
          - {log_id: a, t: 0, is_slowed: true, is_clear: false, queue_extent_miles: 2.0, min_ratio: 0.5}
          - {log_id: a, t: 5, is_slowed: true, is_clear: false, queue_extent_miles: 2.0, min_ratio: 0.5}
          - {log_id: a, t: 10, is_slowed: true, is_clear: false, queue_extent_miles: 2.0, min_ratio: 0.5}
          - {log_id: a, t: 15, is_slowed: false, is_clear: true, queue_extent_miles: null, min_ratio: 1.0}
          - {log_id: a, t: 20, is_slowed: false, is_clear: true, queue_extent_miles: null, min_ratio: 1.0}
          - {log_id: a, t: 25, is_slowed: false, is_clear: true, queue_extent_miles: null, min_ratio: 1.0}
          - {log_id: c, t: 0, is_slowed: false, is_clear: true, queue_extent_miles: null, min_ratio: 1.0}
          - {log_id: c, t: 5, is_slowed: false, is_clear: true, queue_extent_miles: null, min_ratio: 1.0}
          - {log_id: c, t: 10, is_slowed: true, is_clear: false, queue_extent_miles: 2.0, min_ratio: 0.5}
          - {log_id: c, t: 15, is_slowed: true, is_clear: false, queue_extent_miles: 2.0, min_ratio: 0.5}
          - {log_id: c, t: 20, is_slowed: true, is_clear: false, queue_extent_miles: 2.0, min_ratio: 0.5}
          - {log_id: c, t: 25, is_slowed: true, is_clear: false, queue_extent_miles: 2.0, min_ratio: 0.5}
    expect:
      rows:
        - {log_id: a, landmark_min: 10, type_code: "1182", n_notes: 1, blocking_now: true,  max_lanes_blocked: 2, sigalert: false, units_assigned: 1, units_at_scene: 1, first_at_scene_min: 8, chp_closed: false, backed_up_now: true,  slowed_minutes_so_far: 10, remaining_minutes: 5,  is_censored: false}
        - {log_id: a, landmark_min: 20, type_code: "1181", n_notes: 2, blocking_now: false, max_lanes_blocked: 2, sigalert: false, units_assigned: 1, units_at_scene: 1, first_at_scene_min: 8, chp_closed: false, backed_up_now: false, slowed_minutes_so_far: 15, remaining_minutes: 0,  is_censored: false}
        - {log_id: a, landmark_min: 30, type_code: "1181", n_notes: 3, blocking_now: false, max_lanes_blocked: 2, sigalert: true,  units_assigned: 1, units_at_scene: 1, first_at_scene_min: 8, chp_closed: true,  backed_up_now: false, slowed_minutes_so_far: 15, remaining_minutes: 0,  is_censored: false}
        - {log_id: c, landmark_min: 10, type_code: "1183", n_notes: 0, blocking_now: false, max_lanes_blocked: null, sigalert: false, units_assigned: 0, units_at_scene: 0, first_at_scene_min: null, chp_closed: false, backed_up_now: false, slowed_minutes_so_far: 0, remaining_minutes: 30, is_censored: true}
        - {log_id: c, landmark_min: 20, type_code: "1183", n_notes: 0, blocking_now: false, max_lanes_blocked: null, sigalert: false, units_assigned: 0, units_at_scene: 0, first_at_scene_min: null, chp_closed: false, backed_up_now: true,  slowed_minutes_so_far: 10, remaining_minutes: 20, is_censored: true}
        - {log_id: c, landmark_min: 30, type_code: "1183", n_notes: 0, blocking_now: false, max_lanes_blocked: null, sigalert: false, units_assigned: 0, units_at_scene: 0, first_at_scene_min: null, chp_closed: false, backed_up_now: true,  slowed_minutes_so_far: 20, remaining_minutes: 10, is_censored: true}

  - name: training_landmarks_drop_rows_we_cannot_use
    model: fct_training_landmarks
    description: >
      p: our poller first saw it 15 min after CHP logged it -> no 5- or 10-min rows (its notes weren't visible yet).
      q: backup from 0, lost sight of it at 15 min (censored) -> only the 5- and 10-min rows; at 20 and 30
         we don't know whether it was still going.
    overrides:
