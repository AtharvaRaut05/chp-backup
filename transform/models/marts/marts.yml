version: 2

models:
  - name: fct_incident_backup
    description: >
      The label. One row per measurable incident: whether it caused a backup (queue-zone speed
      below slow_ratio x expected), when it started and ended relative to CHP's log time, how long
      it lasted, whether it was still going when the data window ended (censored), how far
      upstream it reached, and its worst speed ratio.
    columns:
      - name: log_id
        tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('stg_chp_incidents'), field: log_id}}
      - name: backup_minutes
        tests: [not_null]

  - name: fct_training_landmarks
    description: >
      Training set. One row per measurable incident per landmark (minutes after the log time,
      var landmarks): features known at that moment (incident, dispatcher notes seen so far, units,
      pre-crash traffic, traffic since the crash) and the target, remaining_minutes until traffic
      is back to normal, with is_censored when that's only a minimum.
    columns:
      - name: log_id
        tests: [not_null]
      - name: remaining_minutes
        tests: [not_null]

unit_tests:
  - name: backup_label_start_recovery_and_censoring
    model: fct_incident_backup
    description: >
      Built from cases found in the label audit. Slot states: S backed up, C clear (above 80% of
      expected), N in between.
      a (audit #1): a single 5-minute dip -> no backup.
      b: backed up 0-15, recovering at 20, clear from 25 -> 25 min (the in-between slot doesn't end it).
      c (audit #20): backed up, crawls at ~70% for 15 min, collapses again, clear at 45 -> one 45-min backup.
      d (audit #32): starts 35 min after the log time -> counted (onset window is now 45 min).
      e: starts at 50 min -> too late to blame on this incident: no backup.
      f: crash-site sensors go silent for 30 min after 10 -> censored at 15 min.
      g: one missed reading during a backup is looked past -> ends at 25.
      h: crash site not visible from 5 to 45 min -> "no backup" isn't certain: not labeled.
      m: no sensor reporting before the crash -> not labeled.
    given:
      - input: ref('int_backup_slots')
        rows:
          - {log_id: a, t: -5, is_slowed: false, is_clear: true, queue_extent_miles: null, min_ratio: 1.0}
          - {log_id: a, t: 0, is_slowed: false, is_clear: true, queue_extent_miles: null, min_ratio: 1.0}
          - {log_id: a, t: 5, is_slowed: false, is_clear: true, queue_extent_miles: null, min_ratio: 1.0}
          - {log_id: a, t: 10, is_slowed: true, is_clear: false, queue_extent_miles: 2.0, min_ratio: 0.4}
          - {log_id: a, t: 15, is_slowed: false, is_clear: true, queue_extent_miles: null, min_ratio: 1.0}
          - {log_id: a, t: 20, is_slowed: false, is_clear: true, queue_extent_miles: null, min_ratio: 1.0}
