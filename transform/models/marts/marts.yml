version: 2

models:
  - name: fct_incident_backup
    description: >
      The label. One row per measurable incident: whether it caused a backup (queue-zone speed
      below slow_ratio x expected), when it started and ended relative to CHP's log time, how long
      it lasted, whether it was still going when the data window ended (censored), how far
      upstream it reached, and its worst speed ratio.
    columns:
      - name: log_id
        tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('stg_chp_incidents'), field: log_id}}
      - name: backup_minutes
        tests: [not_null]

unit_tests:
  - name: backup_label_start_recovery_and_censoring
    model: fct_incident_backup
    description: >
      a: backed up 0-10 min, recovers at 15 for 15 straight minutes (reaches 4 mi back).
      b: never slowed. c: still backed up when data ends -> censored.
      e: a 10-minute recovery doesn't count; real recovery at 25.
      f: slowdown at 40 min is after the 30-min onset window -> not attributed.
      d: no healthy sensor before the crash -> not labeled.
    given:
      - input: ref('int_incident_traffic')
        rows:
          - {log_id: a, role: queue, is_observed: true, station_id: 1, miles_upstream: 2.0, minutes_from_log: -5, avg_speed: 60.0, expected_speed: 60.0}
          - {log_id: a, role: queue, is_observed: true, station_id: 1, miles_upstream: 2.0, minutes_from_log: 0, avg_speed: 30.0, expected_speed: 60.0}
          - {log_id: a, role: queue, is_observed: true, station_id: 1, miles_upstream: 2.0, minutes_from_log: 5, avg_speed: 30.0, expected_speed: 60.0}
          - {log_id: a, role: queue, is_observed: true, station_id: 1, miles_upstream: 2.0, minutes_from_log: 10, avg_speed: 30.0, expected_speed: 60.0}
          - {log_id: a, role: queue, is_observed: true, station_id: 1, miles_upstream: 2.0, minutes_from_log: 15, avg_speed: 60.0, expected_speed: 60.0}
          - {log_id: a, role: queue, is_observed: true, station_id: 1, miles_upstream: 2.0, minutes_from_log: 20, avg_speed: 60.0, expected_speed: 60.0}
          - {log_id: a, role: queue, is_observed: true, station_id: 1, miles_upstream: 2.0, minutes_from_log: 25, avg_speed: 60.0, expected_speed: 60.0}
          - {log_id: a, role: queue, is_observed: true, station_id: 1, miles_upstream: 2.0, minutes_from_log: 30, avg_speed: 60.0, expected_speed: 60.0}
          - {log_id: a, role: queue, is_observed: true, station_id: 2, miles_upstream: 4.0, minutes_from_log: -5, avg_speed: 60.0, expected_speed: 60.0}
          - {log_id: a, role: queue, is_observed: true, station_id: 2, miles_upstream: 4.0, minutes_from_log: 0, avg_speed: 60.0, expected_speed: 60.0}
