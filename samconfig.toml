version = 0.1

[default.global.parameters]
stack_name = "chp-backup"
region = "us-west-2"
profile = "traffic"

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
# Failure alerts go to this email (confirm the subscription email AWS sends after deploying).
# DispatchIds: the 8 Southern California CHP centers plus GGCC (Bay Area, Caltrans district 4).
parameter_overrides = [
    "AlertEmail=rautatharva85@gmail.com",
    "DispatchIds=LACC,VTCC,OCCC,INCC,BCCC,BSCC,ICCC,ECCC,GGCC",
]
