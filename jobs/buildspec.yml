# The scheduled job (AWS CodeBuild). The daily workflow starts it after each morning's PeMS download.
#   every day   make sure every bronze table exists (ensure_tables.py); fetch rainfall (weather.py) and parse the
#               saved lane closure files (lane_closures.py); build the
#               incidents table and place new incidents on the OpenStreetMap road (road_layout.py); then
#               rebuild all dbt tables and run their tests. A failed data step only warns: its features
#               stay missing until the next run fills them in.
#   Mondays     also retrain the models, test them in time order (forward_test.py), replace the current
#               model only if the retrained one is at least as good (promote.py), test each candidate data source
#               (feature_check.py), rerun the label audit, save all to
#               s3://<lake bucket>/reports/<date>/ (and reports/latest/), and email a summary
# Start a full run by hand (see jobs/README.md) with FORCE_REPORT=1.
version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet --upgrade pip
      - pip install --quiet -r jobs/requirements.txt

  build:
    commands:
      - set -eo pipefail
      - python jobs/drop_dbt_tmp.py traffic_silver
      - python jobs/ensure_tables.py
      - python jobs/weather.py || echo "WARNING weather step failed; rain features stay missing until the next run"
      - python jobs/lane_closures.py || echo "WARNING lane closure step failed; parsed on the next run"
      - cd "$CODEBUILD_SRC_DIR/transform"
      - dbt seed --profiles-dir . --target aws
      - dbt run --select +stg_chp_incidents --profiles-dir . --target aws
      - cd "$CODEBUILD_SRC_DIR"
      - python jobs/road_layout.py || echo "WARNING road layout step failed; new incidents are placed on the next run"
      - cd "$CODEBUILD_SRC_DIR/transform"
      # Athena occasionally fails a query for reasons of its own; rerun only what failed, once
      - dbt build --profiles-dir . --target aws || (sleep 60 && dbt retry --profiles-dir . --target aws)
      - cd "$CODEBUILD_SRC_DIR"
      - |
        set -eo pipefail
        if [ "$(TZ=America/Los_Angeles date +%u)" = "1" ] || [ "${FORCE_REPORT:-0}" = "1" ]; then
          DAY=$(TZ=America/Los_Angeles date +%F)
          # save what's finished after every step, so a run that stops later still leaves its results
          save() { cp *_output.txt ml/output/ 2>/dev/null || true; aws s3 sync ml/output "s3://$LAKE_BUCKET/reports/$DAY/" --only-show-errors; }
          python ml/train.py --refresh --profile "" --boot 200 2>&1 | tee train_output.txt; save
          python ml/forward_test.py --profile "" --boot 200 2>&1 | tee forward_output.txt; save
          aws s3 sync "s3://$LAKE_BUCKET/models/current/" ml/models/current/ --only-show-errors
          python ml/promote.py --profile "" 2>&1 | tee promote_output.txt
          aws s3 sync ml/models/current/ "s3://$LAKE_BUCKET/models/current/" --only-show-errors; save
          python ml/label_audit.py --profile "" 2>&1 | tee audit_output.txt; save
          # the slowest step: capped at 90 minutes so it can never take the rest of the report down with it
          timeout 5400 python ml/feature_check.py --profile "" --boot 200 2>&1 | tee feature_output.txt \
            || echo "WARNING feature check failed or ran out of time" | tee -a feature_output.txt
          cat promote_output.txt feature_output.txt >> forward_output.txt; save
          aws s3 sync ml/output "s3://$LAKE_BUCKET/reports/latest/" --delete --only-show-errors
          python jobs/email_report.py train_output.txt ml/output/label_audit_severity.csv "$DAY" forward_output.txt
        else
          echo "Not Monday: tables rebuilt, no model report today."
        fi

  post_build:
    commands:
      # Runs even when a build step failed (not after a timeout): keep whatever the report steps wrote, so a long
      # run that breaks near the end still leaves its finished tables behind.
      - |
        cd "$CODEBUILD_SRC_DIR"
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-1}" = "0" ] && ls ml/output/* *_output.txt >/dev/null 2>&1; then
          mkdir -p ml/output && cp *_output.txt ml/output/ 2>/dev/null || true
          aws s3 sync ml/output "s3://$LAKE_BUCKET/reports/failed-run/" --delete --only-show-errors || true
          echo "Partial report saved to s3://$LAKE_BUCKET/reports/failed-run/"
        fi
